tasks.jar {
    manifest {
        attributes(JMap.of(
                "Premain-Class", "dev.csl.mixinloader.MixinLoader",
                "Agent-Class", "dev.csl.mixinloader.MixinLoader",
                "Can-Redefine-Classes", "true",
                "Can-Retransform-Classes", "true"
        ))
    }
}

def patchedAdviceDir = layout.buildDirectory.dir("generated/patched-advice")

def advicePatches = [
	"dev/csl/mixinloader/MixinLoader.class": [
		"register(Ljava/net/URLClassLoader;)V"
	]
]

tasks.shadowJar {
	archiveClassifier.set("")

	minimize()
	mergeServiceFiles()
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	relocate("net.fabricmc.mappingio", "dev.csl.mixinloader.shadow.mappingio")
	relocate("com.google.gson", "dev.csl.mixinloader.shadow.gson")
	relocate("org.yaml.snakeyaml", "dev.csl.mixinloader.shadow.snakeyaml")
	minimize {
		r8 {
			keepRuleFiles.from(
				layout.projectDirectory.file("r8-rules.pro")
			)
			enableOptimization()
		}
	}

	doLast {
		File shadowArchive = archiveFile.get().asFile
		File outputRoot = patchedAdviceDir.get().asFile
		if (outputRoot.exists() && !outputRoot.deleteDir()) {
			throw new GradleException("Could not clean ${outputRoot}")
		}

		new JarFile(shadowArchive).withCloseable { jar ->
			advicePatches.each { String classEntry, List<String> methods ->
				def r8Entry = jar.getJarEntry(classEntry)
				if (r8Entry == null) {
					throw new GradleException("R8 JAR is missing ${classEntry}")
				}

				File javacClass = sourceSets.main.output.classesDirs.files.collect { new File(it, classEntry) }.find { it.isFile() }
				if (javacClass == null) throw new GradleException("javac output is missing ${classEntry}")

				byte[] r8Bytes = jar.getInputStream(r8Entry).withCloseable { it.bytes }
				byte[] patched = AdviceMethodSplicer.replaceMethods(
					r8Bytes,
					javacClass.bytes,
					methods as String[]
				)

				File destination = new File(outputRoot, classEntry)
				destination.parentFile.mkdirs()
				destination.bytes = patched
			}
		}

		File jarTool = Jvm.current().getExecutable("jar")
		if (!jarTool.isFile()) throw new GradleException("Could not locate the JDK jar tool.")

		List<String> command = [
			jarTool.absolutePath,
			"--update",
			"--file",
			shadowArchive.absolutePath
		]
		advicePatches.keySet().each { String classEntry ->
			command.add("-C")
			command.add(outputRoot.absolutePath)
			command.add(classEntry)
		}

		providers.exec { commandLine(command) }.result.get().assertNormalExitValue()
	}
}

sourceSets {
    registryStub {
        java.srcDir("src/registryStub/java")
    }
}

tasks.compileRegistryStubJava {
    options.compilerArgs.add("--patch-module=java.base=${sourceSets.registryStub.java.sourceDirectories.singleFile.absolutePath}")
}

var targetJavaVersion = 17
java {
    var javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(Class.forName("org.gradle.api.tasks.compile.JavaCompile") as Class<JavaCompile>).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.add("--add-exports=java.base/jdk.internal.loader=ALL-UNNAMED")
}

tasks.compileJava {
	options.compilerArgs.add("--patch-module=java.base=${sourceSets.registryStub.output.classesDirs.singleFile.absolutePath}")
}

tasks.processResources {
    var props = JMap.of("version", version)
    inputs.properties(props)
    filteringCharset = "UTF-8"
    filesMatching(JList.of("paper-plugin.yml", "plugin.yml")) {
        expand(props)
    }
    from(tasks.compileRegistryStubJava) {
		include("java/util/NamespaceRegistry.class")
		into("META-INF/mixinloader")
	}
}
